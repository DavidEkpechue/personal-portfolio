<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Agent Forge typed communication plane</title><desc id="desc">Authenticated AgentRuns write validated durable messages to scoped task, workflow and owner targets.</desc>
  <defs><radialGradient id="g"><stop stop-color="#7665ff" stop-opacity=".2"/><stop offset="1" stop-color="#07070d" stop-opacity="0"/></radialGradient></defs><rect width="1280" height="760" fill="#07070d"/><circle cx="640" cy="384" r="400" fill="url(#g)"/>
  <g font-family="Inter,Arial,sans-serif"><text x="64" y="62" fill="#9f98c4" font-size="13" letter-spacing="3">AGENT FORGE / COMMUNICATION</text><text x="64" y="118" fill="#f3f1ff" font-size="38" font-weight="650">Typed communication plane</text><text x="64" y="150" fill="#8d889d" font-size="15">Messages cross durable, validated boundaries—not arbitrary agent-to-agent sockets.</text>
  <g stroke="#625a91" stroke-width="2"><path d="M284 346 528 376"/><path d="M284 518 528 408"/><path d="M752 392 996 272"/><path d="M752 392 996 430"/><path d="M752 392 996 588"/></g>
  <rect x="528" y="318" width="224" height="148" fill="#171526" stroke="#8a7bff"/><text x="640" y="364" text-anchor="middle" fill="#f4f2ff" font-size="20" font-weight="600">MESSAGE ENVELOPE</text><text x="640" y="394" text-anchor="middle" fill="#aba5bc" font-size="13">version · sender · target</text><text x="640" y="417" text-anchor="middle" fill="#aba5bc" font-size="13">payload · evidence · priority</text><text x="640" y="440" text-anchor="middle" fill="#aba5bc" font-size="13">correlation · expiry</text>
  <g fill="#0e0d17" stroke="#38344d"><rect x="104" y="294" width="180" height="104"/><rect x="104" y="466" width="180" height="104"/><rect x="996" y="220" width="180" height="104"/><rect x="996" y="378" width="180" height="104"/><rect x="996" y="536" width="180" height="104"/></g>
  <g fill="#efedff" font-size="17" font-weight="600"><text x="130" y="336">Builder run</text><text x="130" y="508">Reviewer run</text><text x="1022" y="262">Task target</text><text x="1022" y="420">Workflow target</text><text x="1022" y="578">Owner inbox</text></g><g fill="#7e798c" font-size="12"><text x="130" y="363">authenticated sender</text><text x="130" y="535">role-constrained</text><text x="1022" y="289">scoped context</text><text x="1022" y="447">durable evidence</text><text x="1022" y="605">bounded decisions</text></g>
  <text x="64" y="698" fill="#6f6a7e" font-size="12">ZOD-VALIDATED CONTRACTS · IDEMPOTENT PERSISTENCE · RESTART-SAFE ROUTING</text></g>
</svg>
