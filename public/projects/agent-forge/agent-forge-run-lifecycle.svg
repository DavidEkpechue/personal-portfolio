<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Agent Forge AgentRun lifecycle</title><desc id="desc">A durable task progresses through queued, prepared, running and terminal AgentRun states backed by a Kubernetes job.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08080f"/><stop offset=".55" stop-color="#0c0a18"/><stop offset="1" stop-color="#07070d"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#8173eb"/></marker></defs>
  <rect width="1280" height="760" fill="url(#bg)"/><g font-family="Inter,Arial,sans-serif"><text x="64" y="62" fill="#9f98c4" font-size="13" letter-spacing="3">AGENT FORGE / EXECUTION</text><text x="64" y="118" fill="#f3f1ff" font-size="38" font-weight="650">AgentRun lifecycle</text><text x="64" y="150" fill="#8d889d" font-size="15">Durable state remains authoritative while disposable workloads execute.</text>
  <g fill="none" stroke="#8173eb" stroke-width="2" marker-end="url(#a)"><path d="M208 350H348"/><path d="M488 350H628"/><path d="M768 350H908"/><path d="M1048 350H1170"/></g>
  <g fill="#0f0e19" stroke="#3d3957"><rect x="68" y="302" width="140" height="96"/><rect x="348" y="302" width="140" height="96"/><rect x="628" y="302" width="140" height="96"/><rect x="908" y="302" width="140" height="96"/></g>
  <g fill="#f2efff" font-size="18" font-weight="600" text-anchor="middle"><text x="138" y="342">READY</text><text x="418" y="342">QUEUED</text><text x="698" y="342">PREPARING</text><text x="978" y="342">RUNNING</text></g>
  <g fill="#777287" font-size="12" text-anchor="middle"><text x="138" y="370">task claimed</text><text x="418" y="370">command persisted</text><text x="698" y="370">job reconciled</text><text x="978" y="370">typed callback</text></g>
  <rect x="1084" y="276" width="132" height="148" fill="#171526" stroke="#8c7cff"/><text x="1150" y="330" text-anchor="middle" fill="#f6f4ff" font-size="17" font-weight="600">TERMINAL</text><text x="1150" y="360" text-anchor="middle" fill="#a39db8" font-size="12">COMPLETED</text><text x="1150" y="381" text-anchor="middle" fill="#a39db8" font-size="12">or FAILED</text>
  <path d="M698 398V520H978V398" fill="none" stroke="#4c476b" stroke-dasharray="6 6"/><rect x="648" y="520" width="380" height="76" fill="#0d0c15" stroke="#302d43"/><text x="680" y="553" fill="#eeeaff" font-size="16" font-weight="600">Kubernetes job reconciliation</text><text x="680" y="578" fill="#807b90" font-size="13">lost watches recover from durable records</text>
  <text x="1216" y="706" text-anchor="end" fill="#615d72" font-size="12">REPOSITORY-VERIFIED ARCHITECTURE</text></g>
</svg>
