<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Agent Forge pull request delivery workflow</title><desc id="desc">Separate builder and reviewer agents produce, validate, review and merge a bounded GitHub pull request.</desc>
  <rect width="1280" height="760" fill="#07070d"/><g font-family="Inter,Arial,sans-serif"><text x="64" y="62" fill="#9f98c4" font-size="13" letter-spacing="3">AGENT FORGE / DELIVERY</text><text x="64" y="118" fill="#f3f1ff" font-size="38" font-weight="650">Pull-request delivery</text><text x="64" y="150" fill="#8d889d" font-size="15">Builder and reviewer authority remain separate; exact-head checks gate merge readiness.</text>
  <path d="M132 346H1148" stroke="#403b60" stroke-width="2"/><g stroke="#8b7cff" stroke-width="2" fill="#11101c"><circle cx="160" cy="346" r="42"/><circle cx="400" cy="346" r="42"/><circle cx="640" cy="346" r="42"/><circle cx="880" cy="346" r="42"/><circle cx="1120" cy="346" r="42"/></g>
  <g fill="#faf8ff" font-size="16" font-weight="600" text-anchor="middle"><text x="160" y="351">01</text><text x="400" y="351">02</text><text x="640" y="351">03</text><text x="880" y="351">04</text><text x="1120" y="351">05</text></g>
  <g fill="#f0edff" font-size="18" font-weight="600" text-anchor="middle"><text x="160" y="440">Resolve base</text><text x="400" y="440">Builder run</text><text x="640" y="440">Open PR</text><text x="880" y="440">Reviewer run</text><text x="1120" y="440">Merge ready</text></g>
  <g fill="#827d92" font-size="12" text-anchor="middle"><text x="160" y="466">immutable SHA</text><text x="400" y="466">bounded change + tests</text><text x="640" y="466">one durable workflow</text><text x="880" y="466">exact final head</text><text x="1120" y="466">checks + approval</text></g>
  <rect x="306" y="232" width="188" height="38" fill="#171526" stroke="#5c537f"/><text x="400" y="257" text-anchor="middle" fill="#b7afff" font-size="12">ISOLATED WORKSPACE</text><rect x="786" y="232" width="188" height="38" fill="#171526" stroke="#5c537f"/><text x="880" y="257" text-anchor="middle" fill="#b7afff" font-size="12">READ-ONLY REVIEW</text>
  <rect x="300" y="574" width="680" height="68" fill="#0e0d17" stroke="#302d43"/><text x="334" y="605" fill="#eeeaff" font-size="16" font-weight="600">GitHub remains canonical for source-control state</text><text x="334" y="628" fill="#817c90" font-size="13">PostgreSQL persists mappings, checks, findings and orchestration evidence.</text></g>
</svg>
