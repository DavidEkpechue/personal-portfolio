    <rect x="242" y="516" width="432" height="70" fill="#111827" stroke="#6377a0"/>
    <circle cx="278" cy="551" r="7" fill="#a9bce7"/>
    <text x="306" y="545" fill="#eef4ff" font-size="18" font-weight="600">Catalogue and circulation workflow</text>
    <text x="306" y="568" fill="#8f9bb2" font-size="13">availability · issue dates · due dates · returns</text>
  </g>
