<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Minglr moderation system</title><desc id="desc">Reports and live match context move through policy and administration workflows into restrictions and audit records.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#9c72ff"/></marker><radialGradient id="g"><stop stop-color="#7948f2" stop-opacity=".2"/><stop offset="1" stop-color="#07050c" stop-opacity="0"/></radialGradient></defs><rect width="1280" height="720" fill="#07050c"/><circle cx="640" cy="350" r="440" fill="url(#g)"/>
  <g font-family="Inter,Arial,sans-serif"><text x="60" y="58" fill="#b19bd7" font-size="13" letter-spacing="3">MINGLR / OPERATIONS</text><text x="60" y="112" fill="#f6f1ff" font-size="36" font-weight="650">Moderation workflow</text><text x="60" y="143" fill="#91889f" font-size="15">Reports retain party and match context without exposing private session data.</text>
  <g stroke="#9c72ff" stroke-opacity=".65" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M274 324H438"/><path d="M612 324H776"/><path d="M950 324H1112"/></g>
  <g fill="#100b18" stroke="#49355d"><rect x="86" y="268" width="188" height="112"/><rect x="438" y="268" width="174" height="112"/><rect x="776" y="268" width="174" height="112"/><rect x="1112" y="268" width="102" height="112"/></g>
  <g fill="#f4edff" font-size="18" font-weight="600"><text x="112" y="310">Report</text><text x="464" y="310">Policy context</text><text x="802" y="310">Admin review</text><text x="1130" y="310">Action</text></g><g fill="#968aa5" font-size="12"><text x="112" y="338">user · party · match</text><text x="464" y="338">history · severity</text><text x="802" y="338">triage · evidence</text><text x="1130" y="338">restrict</text><text x="1130" y="358">resolve</text></g>
  <rect x="326" y="492" width="628" height="72" fill="#0d0914" stroke="#34243f"/><text x="358" y="523" fill="#ece4fa" font-size="16" font-weight="600">PostgreSQL audit trail</text><text x="358" y="547" fill="#8a8096" font-size="13">reports · decisions · restrictions · operator history</text></g>
