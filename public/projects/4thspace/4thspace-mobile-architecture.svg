  <text x="1083" y="306" text-anchor="middle" fill="#edfaff" font-size="23" font-weight="650">Expo mobile</text><text x="1083" y="338" text-anchor="middle" fill="#8ca0a8" font-size="13">React Native · navigation</text><text x="1083" y="362" text-anchor="middle" fill="#8ca0a8" font-size="13">TanStack Query · SecureStore</text>
  <text x="640" y="328" text-anchor="middle" fill="#effbff" font-size="22" font-weight="650">Shared backend</text><text x="640" y="358" text-anchor="middle" fill="#94a7af" font-size="13">Express · OpenAPI · Socket.IO</text><text x="640" y="382" text-anchor="middle" fill="#94a7af" font-size="13">PostgreSQL / PostGIS · Redis · MeiliSearch</text>
