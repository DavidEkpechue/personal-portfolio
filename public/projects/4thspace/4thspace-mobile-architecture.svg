<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">4thSpace web and mobile architecture</title><desc id="desc">React web and React Native Expo clients share an Express and OpenAPI backend with realtime messaging, discovery and geospatial services.</desc>
  <defs><linearGradient id="bg"><stop stop-color="#071015"/><stop offset="1" stop-color="#09060d"/></linearGradient></defs><rect width="1280" height="720" fill="url(#bg)"/>
  <g font-family="Inter,Arial,sans-serif"><text x="60" y="58" fill="#74aabe" font-size="13" letter-spacing="3">4THSPACE / CLIENT ARCHITECTURE</text><text x="60" y="112" fill="#f2fbff" font-size="36" font-weight="650">One product across web and mobile</text><text x="60" y="143" fill="#83949c" font-size="15">Shared contracts and backend capabilities; purpose-built React and Expo clients.</text>
  <g fill="#0d171d" stroke="#294753"><rect x="90" y="252" width="214" height="180"/><rect x="976" y="252" width="214" height="180"/><rect x="498" y="274" width="284" height="136" stroke="#4b9dba"/></g>
